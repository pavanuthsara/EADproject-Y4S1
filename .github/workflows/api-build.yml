name: .NET Backend Build Check

on:
  push:
    branches: [main]
    paths:
      - "SmartSolarMicrogridAPI/**"
  pull_request:
    branches: [main]
    paths:
      - "SmartSolarMicrogridAPI/**"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore SmartSolarMicrogridAPI.Tests/SmartSolarMicrogridAPI.Tests.csproj

      - name: Build
        run: dotnet build SmartSolarMicrogridAPI/SmartSolarMicrogridAPI.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test SmartSolarMicrogridAPI.Tests/SmartSolarMicrogridAPI.Tests.csproj --configuration Release --no-restore
